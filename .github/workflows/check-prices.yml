name: Check prices

on:
  schedule:
    - cron: "30 * * * *"   # a cada hora, no minuto 0 (ajuste aqui a frequência)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_prices.py

      - name: Commit updated state
        run: |
          git config user.name "price-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history.json
          git diff --cached --quiet || git commit -m "Update price state [skip ci]"
          git push
